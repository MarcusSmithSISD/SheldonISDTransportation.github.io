<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<meta
http-equiv="X-UA-Compatible"
content="IE=edge">

<title>

Sheldon ISD Transportation
Trip Selection Board

</title>

<link
rel="stylesheet"
href="style.css">

<script
src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js">
</script>

</head>

<body>

<div class="dashboard">

<!--======================================================
HEADER
=======================================================-->

<header>

<div class="header-left">

<img
src="logo.png"
alt="Sheldon ISD"
class="logo">

<div class="title-group">

<h1>

Sheldon ISD Transportation

</h1>

<h2>

Trip Selection Board

</h2>

<div id="currentDate">

Loading Date...

</div>

</div>

</div>

<div class="header-right">

<div id="connectionStatus"
class="offline">

CONNECTING...

</div>

<div id="lastUpdated">

Last Updated

</div>

</div>

</header>

<!--======================================================
MAIN
=======================================================-->

<main>

<div class="table-wrapper">

<table id="tripTable">

<colgroup>

<col class="col-trip">

<col class="col-cover">

<col class="col-activity">

<col class="col-campus">

<col class="col-clock">

<col class="col-load">

<col class="col-depart">

<col class="col-return">

<col class="col-destination">

<col class="col-address">

<col class="col-bus">

<col class="col-sponsor">

</colgroup>

<thead>

<tr>

<th class="col-trip">

Trip #

</th>

<th class="col-cover">

Cover

</th>

<th class="col-activity">

Activity

</th>

<th class="col-campus">

Campus

</th>

<th class="col-clock">

Clock In

</th>

<th class="col-load">

Load Time

</th>

<th class="col-depart">

Departure

</th>

<th class="col-return">

Return

</th>

<th class="col-destination">

Destination

</th>

<th class="col-address">

Address

</th>

<th class="col-bus">

Bus

</th>

<th class="col-sponsor">

Sponsor

</th>

</tr>

</thead>

<tbody id="tripBody">

<tr>

<td colspan="12" class="loading">

Loading Trips...

</td>

</tr>

</tbody>

</table>

</div>

</main>

<!--======================================================
FOOTER
=======================================================-->

<footer>

<div class="footer-left">

<div id="tripCount">

Trips: 0

</div>

</div>

<div class="footer-center">

Sheldon ISD Transportation
•
Trip Selection Board
•
Version 8.0

</div>

<div class="footer-right">

<div id="pageNumber">

Page 0 of 0

</div>

</div>

</footer>

</div>

<!--======================================================
JAVASCRIPT
=======================================================-->

<script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Sheldon ISD Transportation
Trip Selection Board

</title>

<link
rel="stylesheet"
href="style.css">

<script
src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js">
</script>

</head>

<body>

<div class="dashboard">

<!--=========================================
HEADER
==========================================-->

<header>

<div class="headerLeft">

<img
src="logo.png"
class="logo"
alt="Sheldon ISD">

<div>

<h1>

Transportation
Trip Selection Board

</h1>

<div
id="currentDate">

Loading...

</div>

</div>

</div>

<div class="headerRight">

<div
id="connectionStatus"
class="online">

● LIVE

</div>

<div
id="lastUpdated">

Last Updated

</div>

</div>

</header>

<!--=========================================
TABLE
==========================================-->

<main>

<div class="table-container">

<table>

<thead>

<tr>

<th>Trip #</th>

<th>Status</th>

<th>Activity</th>

<th>Departure Campus</th>

<th>Clock In</th>

<th>Load Time</th>

<th>Departure</th>

<th>Return</th>

<th>Destination</th>

<th>Address</th>

<th>Buses</th>

<th>Sponsor</th>

</tr>

</thead>

<tbody
id="tripBody">

<tr>

<td
colspan="12">

Loading Trips...

</td>

</tr>

</tbody>

</table>

</div>
<!--=========================================
FOOTER
==========================================-->

</main>

<footer class="page-footer">

    <div
        id="tripCount">

        Active Trips: 0

    </div>

    <div class="footerCenter">

        Sheldon ISD Transportation

    </div>

    <div
        id="pageNumber">

        Page 1 / 1

    </div>

</footer>

</div>

<!--=========================================
JAVASCRIPT
==========================================-->

<script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="X-UA-Compatible"
          content="IE=edge">

    <title>
        Sheldon ISD Transportation
        Trip Selection Board
    </title>

    <link rel="stylesheet"
          href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

</head>

<body>

    <!--==================================================
        WATERMARK
    ===================================================-->

    <div id="watermark">

        SHELDON ISD

    </div>

    <!--==================================================
        APPLICATION
    ===================================================-->

    <div id="app">

        <!--==============================================
            HEADER
        ==============================================-->

        <header>

            <div class="headerLeft">

                <img id="districtLogo"
                     src="logo.png"
                     alt="Sheldon ISD">

                <div class="titleBlock">

                    <h1>

                        Sheldon ISD Transportation

                    </h1>

                    <h2>

                        Trip Selection Board

                    </h2>

                </div>

            </div>

            <div class="headerRight">

                <div id="currentDate">

                    Loading...

                </div>

                <div id="connectionStatus"
                     class="connecting">

                    CONNECTING...

                </div>

                <div id="lastSync">

                    Last Updated

                </div>

            </div>

        </header>

        <!--==============================================
            MAIN
        ==============================================-->

        <main>

            <div id="tableContainer">

                <table id="tripTable">

                    <thead>

                        <tr>

                            <th>Trip #</th>

                            <th>Status</th>

                            <th>Activity</th>

                            <th>Destination</th>

                            <th>Campus</th>

                            <th>Clock In</th>

                            <th>Load Time</th>

                            <th>Depart</th>

                            <th>Return</th>

                            <th>Buses</th>

                            <th>Sponsor</th>

                            <th>Address</th>

                        </tr>

                    </thead>

                    <tbody id="tripBody">

                        <tr>

                            <td colspan="12"
                                class="loading">

                                Loading Trips...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </main>

        <!--==============================================
            FOOTER
        ==============================================-->

        <footer>

            <div id="tripCount">

                Trips: 0

            </div>

            <div id="pageNumber">

                Page 1 of 1

            </div>

            <div id="version">

                Version 11.0

            </div>

            <div id="refreshTime">

                Updated --:--

            </div>

        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
